{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Add Book" %} - Book Store{% endblock %}

{% block content %}

<h1 class="mb-4">{% trans "Add New Book" %}</h1>

<form method="post" class="card p-4 shadow-sm">

    {% csrf_token %}

    {{ form.as_p }}

    <div class="mt-3">

        <button type="submit" class="btn btn-success">
            {% trans "Save Book" %}
        </button>

        <a href="{% url 'books:book_list' %}" class="btn btn-secondary">
            {% trans "Cancel" %}
        </a>

    </div>

</form>

{% endblock %}
