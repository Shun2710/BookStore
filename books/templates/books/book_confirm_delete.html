{% extends 'base.html' %}

{% block title %}Delete Book - Book Store{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h1 class="text-danger">Delete Book</h1>

        <p class="mt-3">
            Are you sure you want to delete
            <strong>{{ book.title }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'books:book_detail' book.pk %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>

</div>

{% endblock %}
